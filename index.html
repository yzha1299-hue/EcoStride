<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!--
      Content-Security-Policy: defense-in-depth against XSS. No 'unsafe-inline'
      or 'unsafe-eval' in script-src, so even if a script-injection bug slipped
      into a future change, the browser would refuse to execute the injected
      script. apis.google.com/gstatic.com are allowlisted because Firebase Auth
      loads Google's reCAPTCHA verification script from there for bot protection
      on email/password sign-in - not something this app's own code references.
      style-src allows 'unsafe-inline' only because Vite's dev server hot-injects
      CSS as <style> tags (production builds use an external stylesheet instead);
      connect-src is scoped to this app's own Firebase/Google endpoints and its
      API Worker (filled in by Vite from VITE_API_BASE_URL at build time), so
      injected script still can't exfiltrate data elsewhere.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' https://apis.google.com https://www.gstatic.com;
        worker-src 'self' blob:;
        style-src 'self' 'unsafe-inline';
        img-src 'self' data:;
        font-src 'self' data:;
        connect-src 'self' ws: wss: https://*.googleapis.com https://*.firebaseio.com https://www.google.com %VITE_API_BASE_URL%;
        frame-src 'self' https://*.firebaseapp.com https://www.google.com https://recaptcha.google.com;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
      "
    />
    <title>EcoStride Melbourne</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
